  <!-- Toast Notification Container -->
  <div id="culta-toast" class="culta-toast" role="alert" aria-live="polite"></div>

  <!-- Global Scripts -->
  <script>
    // Toast function
    window.cultaShowToast = function(msg, type) {
      const t = document.getElementById('culta-toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'culta-toast' + (type === 'error' ? ' error' : '') + ' show';
      setTimeout(() => { t.className = 'culta-toast'; }, 3500);
    };

    // Form submit toast patch - contact form-a hook et
    document.addEventListener('DOMContentLoaded', function() {
      // WhatsApp form submit interceptor
      const observer = new MutationObserver(function() {
        const sendBtns = document.querySelectorAll('.btn-whatsapp, [class*="btn"]:not([data-toast-patched])');
        sendBtns.forEach(function(btn) {
          if (btn.dataset.toastPatched) return;
          btn.dataset.toastPatched = '1';
          const originalHref = btn.href;
          if (originalHref && originalHref.includes('wa.me')) {
            btn.addEventListener('click', function() {
              setTimeout(function() {
                window.cultaShowToast('✅ Mesajınız WhatsApp-a göndərildi! Tezliklə cavab veriləcək.', 'success');
              }, 300);
            });
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
